; ARCANA PROFILE overrides
date.timezone = Asia/Bangkok
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
memory_limit = 256M
; AI calls may retry / fall back to other models
max_execution_time = 300
; bulk import sends up to 5,000 rows per type as JSON
post_max_size = 20M
upload_max_filesize = 20M
