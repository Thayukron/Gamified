server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    # redirects must keep the host:port the browser used (the container listens on 80, the host on APP_PORT)
    absolute_redirect off;

    # bulk import posts large JSON
    client_max_body_size 20m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # API -> PHP container (AI requests can take a while)
    location /api/ {
        proxy_pass http://api:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # hashed build assets never change
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # static files (art, fonts, sounds): a missing file is a 404, not the app shell
    location ~* \.(webp|png|jpe?g|gif|svg|ico|ttf|otf|woff2?|mp3|ogg|wav|json|txt|pdf)$ {
        try_files $uri =404;
        expires 7d;
    }

    # single-page app: unknown paths load the app shell
    location / {
        # "$uri/index.html" instead of "$uri/" avoids the /login -> /login/ directory redirect
        try_files $uri $uri/index.html /index.html;
        add_header Cache-Control "no-cache";
    }
}
